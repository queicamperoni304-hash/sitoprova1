<!doctype html><meta charset="utf-8">
<title>Kompla — generatore del film radar</title>
<style>html,body{margin:0;background:#05090F}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
/* Generatore deterministico del film radar di Kompla.
   Non viene servito al pubblico: produce i frame JPEG che il sito scrubba.
   Stesso seme => stessi frame, sempre. */
const AMBER='245,166,35', TEAL='28,191,180', PALE='180,192,212';
const TURNS = 3.25;          // giri completi della spazzata su tutto il film
const NBLIP = 72;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeBlips(){
  const r=mulberry32(0x4B4F4D50), out=[];
  for(let i=0;i<NBLIP;i++){
    const ang=r()*Math.PI*2;
    const rad=0.17+Math.pow(r(),0.72)*0.80;
    const birth=Math.pow(i/NBLIP,0.92)*0.80;
    // 24% dei documenti porta un rischio: il resto non deve rubare un minuto a nessuno
    const risk=r()<0.24;
    // angolo di spazzata (da -PI/2) a cui questo blip viene raggiunto
    let off=(ang-(-Math.PI/2))%(Math.PI*2); if(off<0)off+=Math.PI*2;
    const birthTotal=birth*Math.PI*2*TURNS;
    let k=Math.ceil((birthTotal-off)/(Math.PI*2)); if(k<0)k=0;
    const detT=(off+k*Math.PI*2)/(Math.PI*2*TURNS);
    out.push({ang,rad,birth,risk,detT,w:4.6+r()*2.6,h:6.8+r()*4.0,rot:(r()-0.5)*0.5});
  }
  return out;
}
const BLIPS=makeBlips();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ramp=(v,a,b)=>clamp((v-a)/(b-a||1e-6),0,1);

function drawFrame(x,W,H,t){
  const cx=W/2, cy=H*0.5, R=Math.min(W,H)*0.395, S=Math.min(W,H)/810;

  // --- terreno ---
  let g=x.createRadialGradient(cx,cy*0.92,0,cx,cy,Math.max(W,H)*0.72);
  g.addColorStop(0,'#16273F'); g.addColorStop(0.44,'#0C1728'); g.addColorStop(1,'#05090F');
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // --- raggi ogni 30° ---
  x.lineWidth=Math.max(1,S);
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    x.strokeStyle='rgba('+PALE+',0.055)';
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); x.stroke();
  }

  // --- anelli concentrici: il marchio ---
  const rings=[0.16,0.30,0.46,0.64,0.84,1.0];
  rings.forEach((f,i)=>{
    x.strokeStyle='rgba('+AMBER+','+(0.30-i*0.035).toFixed(3)+')';
    x.lineWidth=Math.max(1,S*(i===5?1.3:1));
    x.beginPath(); x.arc(cx,cy,R*f,0,Math.PI*2); x.stroke();
  });
  // tacche sull'anello esterno
  for(let i=0;i<72;i++){
    const a=i*Math.PI/36, lg=(i%6===0)?9:4.5;
    x.strokeStyle='rgba('+AMBER+','+((i%6===0)?0.34:0.16)+')';
    x.lineWidth=Math.max(1,S);
    x.beginPath();
    x.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    x.lineTo(cx+Math.cos(a)*(R+lg*S),cy+Math.sin(a)*(R+lg*S));
    x.stroke();
  }

  // --- la spazzata ---
  const A=-Math.PI/2+t*Math.PI*2*TURNS;
  const SPAN=1.32, STEPS=180;                  // ~75° di coda
  x.save();
  for(let k=0;k<STEPS;k++){
    const a1=A-(k/STEPS)*SPAN, a0=A-((k+1)/STEPS)*SPAN;
    const al=Math.pow(1-k/STEPS,2.1)*0.34;
    x.fillStyle='rgba('+AMBER+','+al.toFixed(4)+')';
    x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,R,a0,a1); x.closePath(); x.fill();
  }
  x.strokeStyle='rgba(255,220,158,0.9)'; x.lineWidth=Math.max(1,S*1.4);
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(A)*R,cy+Math.sin(A)*R); x.stroke();
  x.restore();
  // testa luminosa della spazzata
  x.save(); x.shadowColor='rgba('+AMBER+',0.95)'; x.shadowBlur=22*S;
  x.fillStyle='rgba(255,226,170,0.95)';
  x.beginPath(); x.arc(cx+Math.cos(A)*R,cy+Math.sin(A)*R,2.6*S,0,Math.PI*2); x.fill();
  x.restore();

  // --- i documenti ---
  for(const b of BLIPS){
    if(t<b.birth) continue;
    const bx=cx+Math.cos(b.ang)*R*b.rad, by=cy+Math.sin(b.ang)*R*b.rad;
    const seen=t>=b.detT;
    const flash=seen?1-ramp(t,b.detT,b.detT+0.035):0;
    const w=b.w*S*(1+flash*0.7), h=b.h*S*(1+flash*0.7);
    let col, glow;
    if(!seen){ col='rgba('+PALE+','+(0.20+ramp(t,b.birth,b.birth+0.04)*0.24).toFixed(3)+')'; glow=0; }
    else if(b.risk){ col='rgba('+AMBER+',0.95)'; glow=(10+flash*26)*S; }
    else { col='rgba('+TEAL+',0.80)'; glow=(5+flash*16)*S; }
    x.save(); x.translate(bx,by); x.rotate(b.rot);
    if(glow){ x.shadowColor=col; x.shadowBlur=glow; }
    x.fillStyle=col; x.fillRect(-w/2,-h/2,w,h);
    x.restore();
    // il rischio si annuncia con un anello che si allarga
    if(seen&&b.risk&&flash>0){
      x.strokeStyle='rgba('+AMBER+','+(flash*0.55).toFixed(3)+')';
      x.lineWidth=Math.max(1,S*1.2);
      x.beginPath(); x.arc(bx,by,(6+(1-flash)*20)*S,0,Math.PI*2); x.stroke();
    }
  }

  // --- l'arco di copertura sull'anello esterno ---
  let done=0; for(const b of BLIPS) if(t>=b.detT) done++;
  const cov=done/NBLIP;
  if(cov>0.004){
    x.save();
    x.shadowColor='rgba('+TEAL+',0.6)'; x.shadowBlur=10*S;
    x.strokeStyle='rgba('+TEAL+',0.62)'; x.lineWidth=Math.max(1.5,S*2.6);
    x.lineCap='round';
    x.beginPath(); x.arc(cx,cy,R*1.045,-Math.PI/2,-Math.PI/2+cov*Math.PI*2); x.stroke();
    x.restore();
  }

  // --- il marchio al centro ---
  const pulse=0.5+0.5*Math.sin(t*Math.PI*2*3.5);
  const k=13*S, rr=3.4*S;
  x.save(); x.shadowColor='rgba('+AMBER+',0.85)'; x.shadowBlur=(16+pulse*12)*S;
  x.fillStyle='rgba('+AMBER+',0.96)';
  x.beginPath();
  x.moveTo(cx-k+rr,cy-k); x.arcTo(cx+k,cy-k,cx+k,cy+k,rr);
  x.arcTo(cx+k,cy+k,cx-k,cy+k,rr); x.arcTo(cx-k,cy+k,cx-k,cy-k,rr);
  x.arcTo(cx-k,cy-k,cx+k,cy-k,rr); x.closePath(); x.fill();
  x.restore();
  x.fillStyle='#12203A'; x.font='700 '+(17*S).toFixed(1)+'px Helvetica,Arial,sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText('K',cx,cy+0.6*S);

  // --- vignettatura ---
  g=x.createRadialGradient(cx,cy,R*0.55,cx,cy,Math.max(W,H)*0.78);
  g.addColorStop(0,'rgba(5,9,15,0)'); g.addColorStop(1,'rgba(5,9,15,0.88)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
}

window.coverageSeries=function(n){
  const out=[];
  for(let i=0;i<n;i++){ const t=i/(n-1); let d=0;
    for(const b of BLIPS) if(t>=b.detT) d++;
    out.push(d); }
  return out;
};
window.NBLIP=NBLIP;
window.renderTo=function(W,H,t){
  const c=document.getElementById('c');
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  drawFrame(c.getContext('2d'),W,H,t);
  return c.toDataURL('image/jpeg',0.72);
};
</script>
